services:
  elixir:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      MATRIX_DIR: /data
      VECTOR_DIR: /vectors
      IMAGE_DIR: /app/imagens
      PORT: "8081"
    volumes:
      - ${DIS_MATRIX_DIR:-./data}:/data:ro
      - ${DIS_VECTOR_DIR:-./vectors}:/vectors:ro
      - ./imagens:/app/imagens
