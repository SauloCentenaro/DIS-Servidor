server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Docker DNS is resolved again when the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://servidor:8080;
    location = /api {
        proxy_pass $backend/;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ~* ^/assets/.*\.csv$ {
        types { text/csv csv; }
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
